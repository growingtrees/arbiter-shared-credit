  <rect width="100%" height="100%" fill="#f6f4ef"/>
  <text x="28" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#243040">rr_arb instantiation</text>
  <text x="28" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6570">rr_arb_shared_credit builds req_en from class credit and instantiates u_rr_arb.</text>
